<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cricket OBS Full Screen</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{min-height:100vh}
.wrap{width:100vw;height:100vh;padding:1.2vw;display:flex;background:transparent}
.board{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;background:#07111f;border:2px solid rgba(255,255,255,.14);box-shadow:0 0 40px rgba(0,0,0,.55)}
.hero{flex:0 0 56%;min-height:0;display:grid;grid-template-columns:1fr 1.38fr 1fr;background:linear-gradient(110deg,#062d54 0%,#081426 47%,#280913 100%)}
.side{min-width:0;padding:1.8vw;display:flex;align-items:center;gap:1vw}
.side.right{justify-content:flex-end;text-align:right}
.flag{width:5.2vw;height:5.2vw;min-width:56px;min-height:56px;border-radius:50%;background:#f4f4f4;color:#111;display:flex;align-items:center;justify-content:center;font-size:2.25vw;border:3px solid #fff}
.team{font-size:clamp(24px,2.6vw,50px);font-weight:1000;letter-spacing:.035em;text-transform:uppercase;line-height:.95}
.score{font-size:clamp(44px,4.7vw,92px);line-height:.92;color:#ffd21a;font-weight:1000;margin-top:.4vw;white-space:nowrap}
.overs{font-size:clamp(16px,1.8vw,35px);font-weight:900;margin-top:.5vw;color:#e7edf5}
.bowling-label{font-size:clamp(16px,1.55vw,30px);font-weight:1000;color:#9edcff;margin-top:.5vw;text-transform:uppercase}
.middle{min-width:0;margin:1vw .45vw;padding:.65vw .7vw;border-radius:14px;background:linear-gradient(145deg,#a80e1d,#ef1e35 52%,#9f0d1c);border:2px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.battle{font-size:clamp(18px,1.55vw,30px);font-weight:1000;letter-spacing:.05em;font-style:italic;line-height:1}
.versus{font-size:clamp(20px,1.8vw,36px);font-weight:1000;color:#fff;line-height:1;margin:.12vw 0}
.captains{display:flex;align-items:center;justify-content:space-between;gap:.35vw;width:100%;height:min(15vw,290px);padding:0 .2vw}
.captain{width:42%;height:90%;padding:.35vw;border-radius:14px;background:linear-gradient(180deg,rgba(5,37,72,.94),rgba(4,21,39,.9));border:2px solid rgba(90,190,255,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.captain.redcap{background:linear-gradient(180deg,rgba(90,7,20,.94),rgba(46,3,10,.9));border-color:rgba(255,185,195,.8)}
.capphoto{width:min(5.2vw,100px);height:min(5.2vw,100px);min-width:46px;min-height:46px;border-radius:50%;object-fit:cover;background:#18283c;border:2px solid #fff;display:block}
.jersey{width:min(4.8vw,92px);height:min(4.2vw,80px);min-width:44px;min-height:38px;margin-top:.18vw;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:1000;font-size:clamp(10px,.72vw,15px);text-shadow:0 1px 2px rgba(0,0,0,.5);clip-path:polygon(22% 0,38% 9%,62% 9%,78% 0,100% 24%,84% 38%,84% 100%,16% 100%,16% 38%,0 24%);border:2px solid rgba(255,255,255,.85)}
.jersey.blue{background:linear-gradient(160deg,#0b79c9,#073b72 60%,#0b69b5)}
.jersey.red{background:linear-gradient(160deg,#e32a45,#8f1025 60%,#5b0715)}
.jersey span{transform:translateY(4px);letter-spacing:.04em}
.caprole{font-size:clamp(9px,.62vw,13px);color:#ffe15a;font-weight:900;text-transform:uppercase;margin-top:.18vw}
.capname{font-size:clamp(16px,1.35vw,27px);font-weight:1000;line-height:1.05;margin-top:.08vw;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capteam{font-size:clamp(9px,.62vw,13px);color:#f3d8dc;margin-top:.1vw;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-badge{flex:0 0 auto;width:clamp(36px,2.8vw,54px);height:clamp(36px,2.8vw,54px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffd21a;color:#4d0710;font-size:clamp(11px,.82vw,17px);font-weight:1000;border:2px solid #fff}
.status{margin-top:.2vw;padding:.28vw .65vw;border-radius:999px;background:rgba(80,0,8,.62);border:1px solid rgba(255,255,255,.25);font-size:clamp(10px,.7vw,14px);font-weight:1000;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{flex:0 0 8%;min-height:42px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center;background:linear-gradient(90deg,#b10f1e,#e21b2e,#b10f1e);font-size:clamp(16px,1.45vw,29px);font-weight:1000}
.info b{color:#ffe15a}
.over-stage{flex:0 0 14%;min-height:70px;display:flex;align-items:center;justify-content:center;padding:.55vw 1vw;background:#07111f}
.over-panel{width:min(72%,1100px);height:92%;min-height:58px;padding:.45vw .8vw;border-radius:12px;background:linear-gradient(145deg,#0c1b2d,#101827);border:1px solid rgba(255,255,255,.2);box-shadow:0 0 18px rgba(0,0,0,.28);display:flex;flex-direction:column;justify-content:center}
.current-over-head{display:flex;align-items:center;justify-content:space-between;gap:.4vw;font-size:clamp(10px,.72vw,16px);font-weight:1000;text-transform:uppercase}
.current-over-free{color:#ffe13a}
.over-balls{display:flex;justify-content:center;gap:.35vw;margin-top:.35vw;overflow:hidden}
.over-ball{min-width:clamp(25px,2.1vw,42px);height:clamp(25px,2.1vw,42px);padding:0 .25vw;border-radius:50%;background:#101b2a;border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:clamp(10px,.75vw,16px);font-weight:1000;color:#fff}
.over-ball.boundary{background:#ffd21a;color:#4d0710}.over-ball.extra{background:#fff;color:#8b1027}.over-ball.wicket{background:#101010;color:#ff5d70}.over-ball.freehit{outline:2px solid #ffe13a;outline-offset:1px}
.last-ball{margin-top:.22vw;font-size:clamp(8px,.58vw,13px);font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1.25fr 1fr}
.card{min-width:0;min-height:0;padding:1.45vw 1.35vw 1.2vw;display:flex;flex-direction:column;justify-content:flex-start;position:relative;overflow:hidden}
.card.bat{background:linear-gradient(135deg,#078ac4,#18a9dc 58%,#0789bf);border-right:1px solid rgba(255,255,255,.16)}
.card.bat.two{background:linear-gradient(135deg,#0782ba,#20a7dc 58%,#087fb5)}
.card.bowl{background:linear-gradient(135deg,#b61d4b,#d63c62 58%,#9e173e)}
.card-title{font-size:clamp(18px,2.05vw,45px);font-weight:1000;letter-spacing:.05em;color:#fff;margin-bottom:.7vw;text-transform:uppercase}
.player-row{display:flex;align-items:flex-end;justify-content:space-between;gap:1vw;min-width:0}
.player-main{min-width:0;display:flex;align-items:center;gap:.5vw}
.player-name{font-size:clamp(24px,2.35vw,46px);font-weight:1000;line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.player-flag{font-size:clamp(22px,2vw,38px);line-height:1;flex:0 0 auto}
.player-score{font-size:clamp(28px,2.5vw,48px);font-weight:1000;color:#ffe13a;line-height:1;white-space:nowrap}
.bowler-row{display:flex;align-items:flex-end;justify-content:space-between;gap:.7vw;min-width:0}
.bowler-row .player-main{flex:1;min-width:0}.bowler-row .bowler-stats{flex:0 0 auto;margin-top:0}
.sub{font-size:clamp(12px,1.05vw,20px);font-weight:900;margin-top:.7vw;color:rgba(255,255,255,.92)}
.strike{display:inline-flex;align-items:center;gap:.35em;margin-top:.65vw;padding:.28vw .7vw;border-radius:999px;background:#ffd21a;color:#4d0710;font-size:clamp(14px,1.05vw,30px);font-weight:1000;box-shadow:0 0 14px rgba(255,210,26,.38);width:max-content}
.strike.off{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.bowler-stats{font-size:clamp(16px,1.5vw,40px);font-weight:1000;color:#ffe13a;line-height:1.1;margin-top:.55vw;white-space:nowrap}
.bottom{flex:0 0 2%;min-height:22px;background:#05090f;display:flex;align-items:center;justify-content:space-between;padding:0 1vw;font-size:clamp(8px,.65vw,13px);font-weight:800;color:#d7e0ea}
.live-dot{color:#54ff7a}.empty{height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,1.3vw,28px);font-weight:1000;color:#ffe13a}
@media(max-width:700px){.over-panel{width:92%}.hero{grid-template-columns:1fr 1.38fr 1fr}.side{padding:1.4vw}.capphoto{width:5.8vw;height:5.8vw}.jersey{width:5.3vw;height:4.6vw}.player-name{font-size:clamp(18px,3.2vw,34px)}.player-score{font-size:clamp(20px,3vw,34px)}.card-title{font-size:clamp(14px,2.4vw,26px)}.player-flag{font-size:clamp(18px,2.8vw,30px)}}
</style>
</head>
<body>
<div class="wrap"><div class="board" id="board"><div class="empty">LOADING LIVE SCORE…</div></div></div>
<script>
const params=new URLSearchParams(location.search),matchId=params.get('match_id')||'';
const fallbackImg=name=>'https://ui-avatars.com/api/?name='+encodeURIComponent(name||'Captain')+'&size=256&background=15263c&color=ffffff&bold=true&format=png';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function jersey(code,red){return `<div class="jersey ${red?'red':'blue'}" title="Team jersey"><span>${esc(code||'TEAM')}</span></div>`;}
function cap(c,i,team,code,flag){return c?`<div class="captain ${i?'redcap':''}"><img class="capphoto" src="${esc(c.image||fallbackImg(c.name))}" onerror="this.src='${fallbackImg(c.name)}'">${jersey(code,i)}<div class="caprole">CAPTAIN</div><div class="capname">${esc(c.name)}</div><div class="capteam">${esc(flag||'🏳️')} ${esc(team||'')}</div></div>`:'';}
function overBox(co){const balls=Array.isArray(co?.balls)?co.balls:[];const items=balls.map(b=>{const l=String(b.label||'');let cls='over-ball ';if(l==='4'||l==='6')cls+='boundary ';if(l.startsWith('WD')||l.startsWith('NB')||l.startsWith('B')||l.startsWith('LB'))cls+='extra ';if(l.startsWith('W'))cls+='wicket ';if(b.free_hit)cls+='freehit';return `<span class="${cls}">${esc(l)}</span>`}).join('');return `<div class="over-panel"><div class="current-over-head"><span>CURRENT OVER${co?.over?' • '+esc(co.over):''}</span>${co?.free_hit?'<span class="current-over-free">FREE HIT</span>':''}</div><div class="over-balls">${items||'<span class="over-ball">—</span>'}</div>${co?.last_ball?`<div class="last-ball">LAST BALL: ${esc(co.last_ball)}</div>`:''}</div>`;}
function render(m){
 const b=m.batsmen||[],c=m.captains||[],bo=m.bowler,b1=b[0]||{},b2=b[1]||{},bi=Number.isInteger(m.batting_index)?m.batting_index:0,bowli=bi===1?0:1;
 const battingTeam=bi===0?m.team1:m.team2,bowlingTeam=bowli===0?m.team1:m.team2;
 const battingFlag=bi===0?m.team1_flag||'🏳️':m.team2_flag||'🏳️',bowlingFlag=bowli===0?m.team1_flag||'🏳️':m.team2_flag||'🏳️';
 const battingCaptain=bi===0?c[0]:c[1],bowlingCaptain=bowli===0?c[0]:c[1];
 const battingCode=bi===0?m.team1_code:m.team2_code,bowlingCode=bowli===0?m.team1_code:m.team2_code;
 const batScore=bi===0?m.team1_score:m.team2_score,batOvers=bi===0?m.team1_overs:m.team2_overs;
 const strike1=!!b1.striker,strike2=!!b2.striker;
 document.getElementById('board').innerHTML=`
 <div class="hero">
  <div class="side"><div class="flag">${esc(battingFlag)}</div><div><div class="team">${esc(battingTeam||'TEAM 1')}</div><div class="score">${esc(batScore||'-')}</div><div class="overs">${esc(batOvers?batOvers+' OVERS':'')}</div></div></div>
  <div class="middle"><div class="battle">CAPTAINS BATTLE</div><div class="versus">VS</div><div class="captains">${cap(battingCaptain,0,battingTeam,battingCode,battingFlag)}<div class="vs-badge">VS</div>${cap(bowlingCaptain,1,bowlingTeam,bowlingCode,bowlingFlag)}</div><div class="status">${esc(m.status||'LIVE')}</div></div>
  <div class="side right"><div><div class="team">${esc(bowlingTeam||'TEAM 2')}</div><div class="bowling-label">BOWLING</div></div><div class="flag">${esc(bowlingFlag)}</div></div>
 </div>
 <div class="info"><div>CRR: <b>${esc(m.crr||'-')}</b></div><div>P'SHIP: <b>${esc(m.partnership||'-')}</b></div><div>${esc(battingTeam||'')} BATTING</div></div>
 <div class="over-stage">${overBox(m.current_over||{})}</div>
 <div class="cards">
  <div class="card bat"><div class="card-title">BATTER 1</div><div class="player-row"><div class="player-main"><span class="player-flag">${esc(battingFlag)}</span><div class="player-name">${esc(b1.name||'-')}</div></div><div class="player-score">${b1.name?esc(b1.runs||'0')+' ('+esc(b1.balls||'0')+')':'-'}</div></div><div class="sub">${strike1?'LIVE BATTER • FACING BOWLER':'LIVE BATTER'}</div><div class="strike ${strike1?'':'off'}">🏏 ${strike1?'ON STRIKE':'NOT ON STRIKE'}</div></div>
  <div class="card bat two"><div class="card-title">BATTER 2</div><div class="player-row"><div class="player-main"><span class="player-flag">${esc(battingFlag)}</span><div class="player-name">${esc(b2.name||'-')}</div></div><div class="player-score">${b2.name?esc(b2.runs||'0')+' ('+esc(b2.balls||'0')+')':'-'}</div></div><div class="sub">${strike2?'LIVE BATTER • FACING BOWLER':'LIVE BATTER'}</div><div class="strike ${strike2?'':'off'}">🏏 ${strike2?'ON STRIKE':'NOT ON STRIKE'}</div></div>
  <div class="card bowl"><div class="current-over" style="display:none"></div><div class="card-title">BOWLER • LIVE</div><div class="bowler-row"><div class="player-main"><span class="player-flag">${esc(bowlingFlag)}</span><div class="player-name">${esc(bo?.name||'-')}</div></div><div class="bowler-stats">${bo?esc(bo.overs)+'-'+esc(bo.maidens)+'-'+esc(bo.runs)+'-'+esc(bo.wickets):'-'}</div></div><div class="sub">${bo?'ECONOMY '+esc(bo.economy):'LIVE BOWLER'}</div></div>
 </div>
 <div class="bottom"><span>LAST UPDATE: <span id="updated">--:--:--</span></span><span class="live-dot">● LIVE CRICKET</span></div>`;
 document.getElementById('updated').textContent=new Date().toLocaleTimeString();
}
async function load(){if(!matchId){document.getElementById('board').innerHTML='<div class="empty">NO MATCH SELECTED</div>';return}try{const r=await fetch('/selected-score?match_id='+encodeURIComponent(matchId)+'&t='+Date.now(),{cache:'no-store'}),j=await r.json();if(j&&j.match)render(j.match)}catch(e){console.log(e)}}
load();setInterval(load,10000);
</script>
</body>
</html>
